<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Driver Drowsiness Detection</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            padding-bottom: env(safe-area-inset-bottom); /* Fix for iPhone notches/bars */
            background-color: #f5f5f5;
            /* Use dvh to account for mobile browser nav bars */
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        h1 { margin: 0; font-size: 1.2rem; }

        main {
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            grid-template-rows: 1fr;
            gap: 15px;
            flex: 1;
            min-height: 0;
            margin-bottom: 10px; /* Extra breathing room at bottom */
        }

        #confidence,
        #spread {
            display: flex;
            min-height: 0;
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px 5px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
            min-height: 0;
        }

        .bar-track {
            flex: 1;
            width: 30px;
            background-color: #e0e0e0;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        .bar-fill {
            width: 100%;
            height: 0%;
            transition: all 0.5s ease;
        }

        #prediction {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }

        /* Portrait layout adjustments for mobile */
        @media (orientation: portrait) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 65px 65px; /* Slightly shorter bars to save space */
                grid-template-areas:
                    "pred"
                    "conf"
                    "sprd";
                gap: 10px;
                margin-bottom: 20px; /* Push content up away from the nav bar */
            }

            #prediction { grid-area: pred; }
            #confidence { grid-area: conf; }
            #spread     { grid-area: sprd; }

            .bar-container {
                flex-direction: row;
                padding: 10px 15px;
            }

            .bar-track {
                flex: 1;
                width: auto;
                height: 18px;
                margin: 0 12px;
                align-items: stretch;
            }

            .bar-fill {
                width: 0%;
                height: 100%;
                transition: all 0.2s ease;
            }

            .bar-label { width: 85px; font-size: 11px; text-align: left; font-weight: bold; }
            .bar-percent { width: 40px; text-align: right; font-size: 11px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Driver Drowsiness Detection</h1>
    </header>
    <main>
        <div id="confidence">
            <div class="bar-container">
                <div class="bar-label">Confidence</div>
                <div class="bar-track">
                    <div class="bar-fill" id="confidence-fill"></div>
                </div>
                <div class="bar-percent" id="confidence-text">0%</div>
            </div>
        </div>

        <div id="prediction">
            <h2 id="prediction-display">Loading…</h2>
        </div>

        <div id="spread">
            <div class="bar-container">
                <div class="bar-label">Drowsy Frames</div>
                <div class="bar-track">
                    <div class="bar-fill" id="spread-fill"></div>
                </div>
                <div class="bar-percent" id="spread-text">0%</div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = '/api/data';
        const POLL_INTERVAL_MS = 500;

        async function fetchData() {
            try {
                const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("API not responding");

                const data = await response.json();
                updatePrediction(data.prediction);
                updateConfidence(data.confidence);
                updateDistribution(data.spread);

            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById("prediction-display").textContent = "OFFLINE";
                document.getElementById("prediction").style.backgroundColor = "#ff9800";
            }
        }

        function updatePrediction(prediction) {
            const display = document.getElementById("prediction-display");
            display.textContent = prediction.toUpperCase();
            document.getElementById("prediction").style.backgroundColor =
                prediction === "drowsy" ? "#ff4d4d" : "#4caf50";
        }

        function isPortrait() {
            return window.matchMedia("(orientation: portrait)").matches;
        }

        function updateConfidence(confidence) {
            const pct = Math.round(confidence * 100);
            const fill = document.getElementById("confidence-fill");
            
            if (isPortrait()) {
                fill.style.width = pct + "%";
                fill.style.height = "100%"; 
            } else {
                fill.style.height = pct + "%";
                fill.style.width = "100%"; 
            }
            
            document.getElementById("confidence-text").textContent = pct + "%";
            fill.style.backgroundColor = pct < 40 ? "#f44336" : pct < 60 ? "#ff9800" : "#4caf50";
        }

        function updateDistribution(spread) {
            const pct = Math.round(spread * 100);
            const fill = document.getElementById("spread-fill");
            
            if (isPortrait()) {
                fill.style.width = pct + "%";
                fill.style.height = "100%";
            } else {
                fill.style.height = pct + "%";
                fill.style.width = "100%";
            }
            
            document.getElementById("spread-text").textContent = pct + "%";
            fill.style.backgroundColor = pct < 40 ? "#4caf50" : pct < 60 ? "#ff9800" : "#f44336";
        }
        
        fetchData();
        setInterval(fetchData, POLL_INTERVAL_MS);
    </script>
</body>
</html>
