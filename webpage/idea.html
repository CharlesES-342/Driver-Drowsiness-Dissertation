<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Drowsiness Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            gap: 10px;
            flex: 1;
        }
        main > div {
            padding: 10px;
        }
        #prediction{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { margin-top: 0; }
        h2 { text-align: center; }

        .bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            gap: 8px;
        }
        .bar-label {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }
        .bar-track {
            flex: 1;
            width: 60%;
            background-color: #e0e0e0;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            border-radius: 50px 50px 50px 50px;
        }
        .bar-fill {
            width: 100%;
            transition: height 0.5s ease, background-color 0.5s ease;
            border-radius: 4px;
            text-align: bottom;
        }
        .bar-percent {
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Driver Drowsiness Detection System</h1>
    </header>
    <main>
        <div id="confidence">
            <div class="bar-container">
                <div class="bar-label">Confidence</div>
                <div class="bar-track">
                    <div class="bar-fill" id="confidence-fill" style="height: 0%;"></div>
                </div>
                <div class="bar-percent" id="confidence-text">0%</div>
            </div>
        </div>

        <div id="prediction">
            <h2>*insert prediction here*</h2>
        </div>

        <div id="spread">
            <div class="bar-container">
                <div class="bar-label">Drowsy Frames</div>
                <div class="bar-track">
                    <div class="bar-fill" id="spread-fill" style="height: 0%;"></div>
                </div>
                <div class="bar-percent" id="spread-text">0%</div>
            </div>
        </div>
    </main>
</body>
<script>
    // will be retrieved by the API
    var information = {
        "prediction": "alert",
        "confidence": 0.3,
        "spread": 0.1
    }

    function updatePrediction(prediction) {
        document.getElementById("prediction").innerHTML = "<h2>" + prediction.toUpperCase() + "</h2>";
        document.getElementById("prediction").style.backgroundColor = prediction === "drowsy" ? "red" : "green";
    }

    function updateConfidence(confidence) {
        const pct = Math.round(confidence * 100);
        document.getElementById("confidence-fill").style.height = pct + "%";
        document.getElementById("confidence-text").textContent = pct + "%";

        const fill = document.getElementById("confidence-fill");
        if (pct < 40) {
            fill.style.backgroundColor = "red";
        } else if (pct < 60) {
            fill.style.backgroundColor = "orange";
        } else {
            fill.style.backgroundColor = "green";
        }
    }

    function updateDistribution(spread) {
        const pct = Math.round(spread * 100);
        document.getElementById("spread-fill").style.height = pct + "%";
        document.getElementById("spread-text").textContent = pct + "%";

        const fill = document.getElementById("spread-fill");
        if (pct < 40) {
            fill.style.backgroundColor = "green";
        } else if (pct < 60) {
            fill.style.backgroundColor = "orange";
        } else {
            fill.style.backgroundColor = "red";
        }
    }

    updatePrediction(information.prediction);
    updateConfidence(information.confidence);
    updateDistribution(information.spread);
</script>
</html>
